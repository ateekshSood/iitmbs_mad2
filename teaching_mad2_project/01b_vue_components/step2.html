<!doctype html>
<html>
    <head>
        <title>Step 1</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        />
    </head>
    <body>
        <div id="app">
            <click-counter
                initial_count="0"
                @click="initial_count+=1"
            ></click-counter>
            <click-counter
                initial_count="0"
                @click="initial_count +=2"
            ></click-counter>
        </div>

        <script>
            Vue.component("click-counter", {
                props: {
                    initial_count: {
                        default: 0,
                    },
                },

                methods: {
                    increment() {
                        this.initial_count += 1;
                    },
                },

                template: `

              <div @click="increment">{{initial_count}}</div>

              `,
            });

            const app = new Vue({
                el: "#app",
            });
        </script>
    </body>
</html>
