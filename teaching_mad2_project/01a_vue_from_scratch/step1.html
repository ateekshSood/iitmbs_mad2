<html>
    <head>
        <title>vue learn init</title>
        <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    </head>
    <body>
        <div id="app">
            {{message}}<br>
            I am {{name}} , i am {{age}} years old :D
        </div>

    <script>

      const app = new Vue({
        el:'#app',
        data:{
          message : "why we still here just to suffer",
          name : "ateeksh",
          age : 19
        }
      }
        
      )
        
      

    </script>
    </body>
    
    
</html>
