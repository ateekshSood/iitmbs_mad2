    <html>
        <head>
            <title>antoher view learn</title>
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
            <link
                href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
                rel="stylesheet"
            />
        </head>
        <body>
            <div id="app" class="container mt-5 text-center">
                <div id="count">The count is {{count}}</div>
                <div id="max">The max is {{max}}</div>
                <button
                    class="btn btn-success"
                    @click="increase"
                    :disabled="count >= max"
                >
                    +
                </button>
            </div>

            <script>
                const app = new Vue({
                    el: "#app",

                    data: {
                        count: 0,
                        max: 5,
                    },

                    methods: {
                        increase() {
                            this.count++;
                        },

                        return_original() {
                            this.count = 0;
                        },

                        decrease() {
                            if (this.count > 0) {
                                this.count--;
                            }
                        },
                    },
                });
            </script>
        </body>
    </html>
