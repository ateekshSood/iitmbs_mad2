<html>
    <head>
        <title>antoher view learn</title>
        <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        
    </head>
    <body>
        <div id="app">
            <div>The count is : {{count}}</div>
            <br />
            <div>
                Click the button to update the count
                <button @click="increase">Inc Count</button>
            </div>

            <div>
                Click the button to return to the original count
                <button @click="return_original">Return</button>
            </div>

            <div>
                Click the button to decrease the count
                <button @click="decrease">decrease</button>
            </div>
        </div>

        <script>
            const app = new Vue({
                el: "#app",

                data: {
                    count: 0,
                },

                methods: {
                    increase() {
                        this.count++;
                    },

                    return_original() {
                        this.count = 0;
                    },

                    decrease(){
                      if(this.count > 0){
                        this.count --;
                      }
                    }
                }
            });
        </script>
    </body>
</html>
