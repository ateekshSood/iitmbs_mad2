<html>
    <head>
        <title>todo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <div id="app">

            <div v-if="todos.length === 0">No tasks yet</div>
            
            <label for="author">Enter the author name : </label>
            <input v-model="author" type="text">
            <label for="task">Enter the task : </label>
            <input v-model="task" type="text">

            <button class="btn btn-success" @click="add_data">Add</button>

            <table class="table">

                <thead>
                    <th>Id</th>
                    <th>Author</th>
                    <th>Task</th>
                </thead>
                <tbody>
                    <tr v-for="todo in todos" :key="todo.id">
                        <td>{{todo.id}}</td>
                        <td>{{todo.author}}</td>
                        <td>{{todo.task}}</td>
                        <td><button class="btn btn-danger" @click="delete_task(todo.id)">Delete</button></td>
                    </tr>
                </tbody>
                
            </table>
            
        </div>

        <script>

          const app = new Vue({
            el : "#app",
            data:{
              todos : [],
              author : "",
              task : "",
              id : 1,
            },

            methods:{
              add_data(){
                const obj = {"id" : this.id , "author" : this.author , "task" : this.task};
                this.todos.push(obj);
                this.id ++;
                this.author = "";
                this.task = "";
              },

              delete_task(id){
                this.todos = this.todos.filter(todo => todo.id !== id);
              }
            }
            
          }
            
          );
          
        </script>
    </body>
</html>
