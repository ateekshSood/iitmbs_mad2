<html>
    <head>
        <title>antoher view learn</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    </head>
    <body>
        <div id="app" class="container mt-5 text-center">
            <div class="display-1" :class="{'text-danger' : count >= max}">The count is : {{count}}</div>
            <br />
            <div v-if="count >=max" class="alert alert-warning">You have reached the max count.</div>
            <div v-else>You have not reached the max limit</div>
            
            <div>
                Click the button to update the count
                <button class="btn btn-success" @click="increase" :disabled="count >= max">Inc Count</button>
            </div>

            <table class="table">
                <thead>
                    <th>id</th>
                    <th>title</th>
                    <th>author</th>
                </thead>
                <tbody>
                    <tr v-for="book in books" :key="books.id">
                        <td>{{book.id}}</td>
                        <td>{{book.title}}</td>
                        <td>{{book.author}}</td>
                    </tr>
            
                    
                </tbody>
                
                
            </table>

            <div>
                Click the button to return to the original count
                <button class="btn btn-secondary" @click="return_original">Return</button>
            </div>

            <div>
                Click the button to decrease the count
                <button class="btn btn-danger" @click="decrease">decrease</button>
            </div>
            <div>
                <input type="text" v-model="newtext">
                <div>{{newtext}}</div>
                
            </div>
        </div>

        <script>
            const app = new Vue({
                el: "#app",

                data: {
                    count: 0,
                    max : 5,
                    books: [
                      { id: 1, title: 'Wings of Fire', author: 'A.P.J. Abdul Kalam' },
                      { id: 2, title: 'The Guide', author: 'R.K. Narayan' },
                      { id: 3, title: 'Malgudi Days', author: 'R.K. Narayan' }
                    ],
                    newtext:"helo",
                },

                methods: {
                    increase() {
                        this.count++;
                    },

                    return_original() {
                        this.count = 0;
                    },

                    decrease(){
                      if(this.count > 0){
                        this.count --;
                      }
                    }
                }
            });
        </script>
    </body>
</html>
